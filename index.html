:root{
  --paper:#fbf6ea; --paper-2:#f3ead6; --ink:#3a3530; --ink-soft:#6b625a; --accent:#d9574a; --accent-2:#4f9a4a;
  --hl:#ffe36e; --card-shadow:0 18px 50px rgba(60,40,20,.35), 0 2px 6px rgba(60,40,20,.18);
  --btn:#fff6e3; --btn-ink:#4a3b2a; --btn-edge:#e4cfa5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#4a3221;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ---- splash */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:
  radial-gradient(ellipse at 50% 30%, #f8f1e2 0%, #ecdfc4 70%, #d9c6a2 100%);z-index:30;transition:opacity .6s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash h1{font-family:'Patrick Hand',cursive;font-size:clamp(44px,9vw,96px);margin:0;color:#3a3530;text-align:center;line-height:1}
#splash p{margin:0;color:#6b625a;font-size:clamp(16px,2.4vw,22px);text-align:center;font-family:'Patrick Hand',cursive;font-size:clamp(22px,3vw,30px)}
#splash .cover{width:min(62vw,560px);aspect-ratio:16/11;border-radius:14px;background:#fff;box-shadow:var(--card-shadow);position:relative;overflow:hidden;border:6px solid #fff}
#splash .cover img{position:absolute}
#start{font:800 clamp(20px,3vw,28px) 'Nunito';padding:14px 34px;border-radius:999px;border:3px solid var(--btn-edge);background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 0 #cdb482;cursor:pointer}
#start:active{transform:translateY(4px);box-shadow:0 2px 0 #cdb482}
#start[disabled]{opacity:.6}
#prog{width:min(62vw,560px);height:8px;border-radius:99px;background:#e2d3b3;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent-2);transition:width .2s}
/* ---- HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
#topbar{position:absolute;top:max(10px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;gap:12px}
#brand{font-family:'Patrick Hand',cursive;font-size:22px;color:#fff3dc;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap}
#bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ffe36e;transition:width .4s}
.icon{width:42px;height:42px;border-radius:50%;border:2px solid var(--btn-edge);background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:20px;cursor:pointer;box-shadow:0 3px 0 #cdb482}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 #cdb482}
.icon.on{background:#ffe36e}
/* text card */
#card{position:absolute;left:18px;bottom:96px;width:min(30vw,400px);max-height:calc(100vh - 210px);background:rgba(251,246,234,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:18px 20px 16px;box-shadow:var(--card-shadow);overflow:auto;transform-origin:left bottom;transition:opacity .35s, transform .35s}
#card.flip{opacity:0;transform:translateY(12px) scale(.98)}
#card:before{content:'';position:absolute;inset:6px;border:1px dashed #d8c7a3;border-radius:8px;pointer-events:none}
#card .pg{font:800 11px 'Nunito';letter-spacing:.14em;color:#a08a63;text-transform:uppercase;margin-bottom:4px}
#card h2{font-family:'Patrick Hand',cursive;font-weight:400;font-size:clamp(22px,2.6vw,30px);margin:0 0 8px;color:#2e2a26;line-height:1.1}
#card p{margin:0 0 10px;font:600 clamp(16px,1.55vw,21px)/1.5 'Nunito';color:var(--ink)}
#card p.list{font-size:clamp(15px,1.45vw,19px);margin:0 0 4px;padding-left:4px}
#card .w{display:inline-block;border-radius:6px;padding:0 3px;margin:0 -3px;cursor:pointer;transition:background .12s,transform .12s;border-bottom:2px solid transparent}
#card .w:hover{border-bottom-color:#e0c98a}
#card .w.hl{background:var(--hl);transform:scale(1.06)}
#card .w.tap{background:#ffd1c7}
#card .tip{margin-top:6px;font:600 11px 'Nunito';color:#a08a63}
/* controls */
#controls{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:14px}
.nav{width:58px;height:58px;border-radius:50%;border:3px solid var(--btn-edge);background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:26px;cursor:pointer;box-shadow:0 5px 0 #cdb482}
.nav:active{transform:translateY(3px);box-shadow:0 2px 0 #cdb482}
.nav[disabled]{opacity:.35;pointer-events:none}
#play{min-width:170px;height:58px;border-radius:999px;border:3px solid var(--btn-edge);background:var(--btn);color:var(--btn-ink);font:800 20px 'Nunito';display:flex;align-items:center;justify-content:center;gap:10px;padding:0 22px;cursor:pointer;box-shadow:0 5px 0 #cdb482}
#play:active{transform:translateY(3px);box-shadow:0 2px 0 #cdb482}
#play.playing{background:#ffe36e}
#play .ico{font-size:22px}
#modes{position:absolute;right:14px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
#zoom{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
#zoom .icon{font-size:22px;font-weight:800}
#zfit{font-size:18px}
.mode{height:38px;border-radius:999px;border:2px solid var(--btn-edge);background:var(--btn);color:var(--btn-ink);font:800 13px 'Nunito';padding:0 14px;cursor:pointer;box-shadow:0 3px 0 #cdb482;display:flex;gap:6px;align-items:center}
.mode.on{background:#ffe36e}
/* label bubble on tapped object */
#label{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;border:3px solid #3a3530;border-radius:14px;padding:8px 16px;font-family:'Patrick Hand',cursive;font-size:30px;color:#2e2a26;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#label:after{content:'';position:absolute;left:50%;bottom:-12px;width:16px;height:16px;background:#fff;border-right:3px solid #3a3530;border-bottom:3px solid #3a3530;transform:translateX(-50%) rotate(45deg)}
#label.show{opacity:1;transform:translate(-50%,-115%)}
/* hint */
#hint{position:absolute;right:18px;bottom:72px;max-width:300px;background:rgba(255,246,227,.95);border:2px dashed #d8c7a3;border-radius:12px;padding:10px 14px;font:600 14px/1.35 'Nunito';color:#5b4d3b;opacity:0;transition:opacity .4s;pointer-events:none}
#hint.show{opacity:1}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:8px 14px;font:600 14px 'Nunito';opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
/* short landscape screens (phones sideways): side card, compact type */
@media (orientation:landscape) and (max-height:520px){
  #card{width:min(36vw,360px);bottom:78px;padding:10px 14px 10px;max-height:calc(100vh - 150px)}
  #card h2{font-size:18px;margin-bottom:4px} #card p{font-size:13px;line-height:1.4;margin-bottom:6px} #card p.list{font-size:12px} #card .tip{display:none}
  .nav{width:46px;height:46px;font-size:20px} #play{height:46px;min-width:130px;font-size:16px} #controls{gap:10px}
  #brand{display:none} #hint{bottom:60px;max-width:220px;font-size:12px}
  #zoom{top:auto;transform:none;bottom:70px;right:10px;flex-direction:row} #zoom .icon{width:36px;height:36px;font-size:18px}
}
/* portrait / small screens */
@media (max-width:900px) and (min-height:521px), (orientation:portrait){
  #card{left:12px;right:12px;width:auto;bottom:92px;max-height:38vh;padding:14px 16px 12px}
  #card p{font-size:16px}
  #card p.list{font-size:14px}
  #modes{right:12px;bottom:auto;top:max(60px,calc(env(safe-area-inset-top) + 52px))}
  #zoom{right:12px;top:max(108px,calc(env(safe-area-inset-top) + 100px));bottom:auto;transform:none;flex-direction:row}
  #zoom .icon{width:38px;height:38px;font-size:19px}
  #hint{top:max(186px,calc(env(safe-area-inset-top) + 178px))}
  #hint{right:12px;left:12px;bottom:auto;top:max(110px,calc(env(safe-area-inset-top) + 100px));max-width:none}
  #brand{display:none}
}
</style>

  currentGroup = pageGroups.get(first.id); currentGroup.visible = true;
  prog.style.width = '100%';
  startBtn.disabled = false; startBtn.textContent = pageIndex > 0 ? `Seguir en la página ${pageIndex + 1}` : '¡Empezar!';
  fitCamera(); camera.position.copy(camBase); camera.lookAt(camTarget);
  frame();
  startBtn.addEventListener('click', async () => {
    actx = new AC(); master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
    if (actx.state === 'suspended') await actx.resume();
    // tiny silent buffer unlocks iOS audio on the gesture
    const b = actx.createBuffer(1, 1, 22050); const s = actx.createBufferSource(); s.buffer = b; s.connect(master); s.start(0);
    splash.classList.add('hide');
    loadBuffer(`audio/${first.id}.mp3`).catch(() => {});
    loadTimings(first.id).then(tm => { prepareBeats(first, currentGroup, tm); beats.active = true; }).catch(() => {});
    [pageIndex + 1].forEach(j => { const p = BOOK.pages[j]; if (p) { buildPage(p); loadBuffer(`audio/${p.id}.mp3`).catch(() => {}); } });
    showHint(first.hint);
    setTimeout(() => startNarration(), 700);
  }, { once: true });
}
boot().catch(err => { console.error(err); startBtn.textContent = 'Error al cargar'; toast(String(err)); });
</script>
